services:
  dashboard:
    build:
      context: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.baseUrlPath=tiktok
      - --server.headless=true
      - --browser.gatherUsageStats=false
    volumes:
      # SQLite WAL readers need to create shared-memory coordination files.
      # The dashboard opens databases with mode=ro and PRAGMA query_only.
      - ./output:/app/output
    ports:
      - "127.0.0.1:8501:8501"

  collector:
    build:
      context: .
    profiles: ["collector"]
    user: "0:0"
    restart: "no"
    command: ["python", "daily_collect.py"]
    environment:
      TIKTOK_PROXY_URL: http://proxy:7890
    volumes:
      - ./output:/app/output
      - ./deploy/daily_config.server.json:/app/daily_config.json:ro
      - /opt/tiktok-secrets:/run/secrets/tiktok:ro

  proxy:
    image: metacubex/mihomo:v1.19.31
    profiles: ["proxy"]
    restart: unless-stopped
    command: ["-d", "/root/.config/mihomo", "-f", "/root/.config/mihomo/config.yaml"]
    volumes:
      - ./runtime/mihomo:/root/.config/mihomo:ro
    ports:
      - "127.0.0.1:7897:7890"
