services:
  dashboard:
    build:
      context: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.baseUrlPath=tiktok
      - --server.headless=true
      - --browser.gatherUsageStats=false
    volumes:
      - ./output:/app/output:ro
    ports:
      - "127.0.0.1:8501:8501"
