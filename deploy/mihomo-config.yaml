mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: global
log-level: warning
ipv6: false

proxy-providers:
  tiktok:
    type: file
    path: ./providers/tiktok.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204

proxy-groups:
  - name: TIKTOK-EXIT
    type: load-balance
    strategy: round-robin
    use: [tiktok]
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false

rules:
  - MATCH,TIKTOK-EXIT
